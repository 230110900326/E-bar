<!-- 本工作台通过 WorkBuddy 资料库能力（library skill）搭建、存储和部署 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>夜半微醺 · 电子酒吧</title>
<style>
  :root{
    --bg-0:#0b0a14; --bg-1:#14101f; --bg-2:#1b1530;
    --amber:#e8a33d; --amber-soft:#f4b860; --amber-glow:rgba(232,163,61,.28);
    --wine:#8b2c3f; --violet:#6b4e8e; --teal:#3d8b7a;
    --ink:#ece8f5; --ink-2:#b8b0cc; --ink-3:#7d7591;
    --line:rgba(255,255,255,.08); --card:rgba(255,255,255,.045); --card-2:rgba(255,255,255,.07);
    --red:#e8584a; --green:#5fb87a;
    --bar-bg:rgba(255,255,255,.1); --dim-bg:rgba(255,255,255,.06);
    --radius:16px; --serif:"Georgia","Noto Serif SC","Songti SC",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  /* ============ 主题：晨曦暖阳（浅色暖橙） ============ */
  :root[data-theme="sunrise"]{
    --bg-0:#f6efe2; --bg-1:#fffdf8; --bg-2:#f0e4cf;
    --amber:#d98c2b; --amber-soft:#a8660f; --amber-glow:rgba(217,140,43,.28);
    --wine:#c05a4e; --violet:#7a6ba6; --teal:#3d8b7a;
    --ink:#2e2820; --ink-2:#5a4d3c; --ink-3:#7a6a52;
    --line:rgba(60,45,25,.14); --card:rgba(255,255,255,.7); --card-2:rgba(255,255,255,.92);
    --red:#d9534f; --green:#3f9d63;
    --bar-bg:rgba(60,45,25,.14); --dim-bg:rgba(60,45,25,.06);
  }
  /* ============ 主题：森林暮色（深绿金） ============ */
  :root[data-theme="forest"]{
    --bg-0:#0b130e; --bg-1:#11211a; --bg-2:#172e23;
    --amber:#d9a441; --amber-soft:#e6bd63; --amber-glow:rgba(217,164,65,.28);
    --wine:#7a4a2b; --violet:#5f7a6b; --teal:#4fa98a;
    --ink:#e9f0ea; --ink-2:#b6c8ba; --ink-3:#7c907f;
    --line:rgba(255,255,255,.09); --card:rgba(255,255,255,.05); --card-2:rgba(255,255,255,.08);
    --red:#e8705a; --green:#5fb87a;
  }
  /* ============ 主题：暮色玫瑰（深紫红） ============ */
  :root[data-theme="rose"]{
    --bg-0:#170d14; --bg-1:#231522; --bg-2:#301c2e;
    --amber:#e89a6b; --amber-soft:#f0b08a; --amber-glow:rgba(232,154,107,.3);
    --wine:#b23a5e; --violet:#8e5a9e; --teal:#5f8a7a;
    --ink:#f4eaf0; --ink-2:#cfb9c8; --ink-3:#93808c;
    --line:rgba(255,255,255,.09); --card:rgba(255,255,255,.05); --card-2:rgba(255,255,255,.08);
    --red:#ef7a6b; --green:#5fb87a;
  }
  /* ============ 主题：深海蓝调（深蓝青） ============ */
  :root[data-theme="ocean"]{
    --bg-0:#0a0f1d; --bg-1:#101a31; --bg-2:#16233f;
    --amber:#e8b04c; --amber-soft:#f2c56e; --amber-glow:rgba(232,176,76,.3);
    --wine:#7a3a6e; --violet:#6b6bb8; --teal:#3fa9c2;
    --ink:#e8eef8; --ink-2:#b6c2d9; --ink-3:#7a8aa8;
    --line:rgba(255,255,255,.09); --card:rgba(255,255,255,.05); --card-2:rgba(255,255,255,.08);
    --red:#e8707a; --green:#5fb87a;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg-0);color:var(--ink);font-family:var(--sans);line-height:1.6;font-size:15px}
  body{
    min-height:100vh;
    background:
      radial-gradient(900px 500px at 80% -10%, rgba(232,163,61,.10), transparent 60%),
      radial-gradient(700px 600px at 10% 110%, rgba(107,78,142,.16), transparent 60%),
      linear-gradient(180deg,#0b0a14 0%,#0e0b18 50%,#0b0a14 100%);
    background-attachment:fixed;
    padding-bottom:env(safe-area-inset-bottom);
  }
  ::selection{background:var(--amber);color:#1a1228}
  .wrap{max-width:920px;margin:0 auto;padding:0 16px 100px}

  /* 顶部招牌 */
  header.bar{position:sticky;top:0;z-index:30;backdrop-filter:blur(14px);
    background:linear-gradient(180deg,rgba(11,10,20,.92),rgba(11,10,20,.55));
    border-bottom:1px solid var(--line);padding:14px 16px}
  .bar-inner{max-width:920px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .logo{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
  .logo-mark{width:38px;height:38px;border-radius:11px;flex-shrink:0;
    background:radial-gradient(circle at 35% 30%,var(--amber-soft),var(--amber) 60%,var(--wine) 140%);
    box-shadow:0 0 18px var(--amber-glow),inset 0 0 8px rgba(255,255,255,.18);
    display:grid;place-items:center}
  .logo-mark svg{width:22px;height:22px}
  .logo-txt h1{font-family:var(--serif);font-size:19px;letter-spacing:1px;color:var(--ink);font-weight:600}
  .logo-txt span{font-size:11px;color:var(--ink-3);letter-spacing:3px;text-transform:uppercase}
  .sync{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-2);
    padding:6px 10px;border:1px solid var(--line);border-radius:20px;background:var(--card);white-space:nowrap}
  .sync .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)}
  .sync.off .dot{background:var(--amber);box-shadow:0 0 6px var(--amber)}
  .sync.off{color:var(--amber-soft)}
  .icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);
    color:var(--ink-2);display:grid;place-items:center;cursor:pointer;flex-shrink:0;transition:.2s}
  .icon-btn:hover{background:var(--card-2);color:var(--amber-soft);border-color:var(--amber-glow)}
  .icon-btn svg{width:18px;height:18px}

  /* 置顶：今夜开门营业 */
  .open-sign{margin-top:18px;border-radius:var(--radius);overflow:hidden;
    background:linear-gradient(135deg,rgba(139,44,63,.22),rgba(107,78,142,.18));
    border:1px solid rgba(232,163,61,.18)}
  .open-head{display:flex;align-items:center;gap:12px;padding:16px 18px}
  .neon{font-family:var(--serif);font-size:20px;color:var(--amber-soft);
    text-shadow:0 0 12px var(--amber-glow),0 0 24px rgba(232,163,61,.15);letter-spacing:1px}
  .open-head .sub{font-size:12px;color:var(--ink-2);margin-left:auto;display:flex;align-items:center;gap:6px}
  .streak{background:rgba(232,163,61,.14);border:1px solid var(--amber-glow);color:var(--amber-soft);
    padding:3px 9px;border-radius:14px;font-size:12px;font-weight:600}
  .open-body{padding:0 18px 16px}
  .open-body p.tip{font-size:13px;color:var(--ink-2);margin-bottom:10px}
  .owe-list{display:flex;flex-direction:column;gap:8px}
  .owe{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:12px;
    background:rgba(232,88,74,.10);border:1px solid rgba(232,88,74,.25)}
  .owe .tag{font-size:11px;color:var(--red);font-weight:600;flex-shrink:0}
  .owe .txt{flex:1;font-size:13px;color:var(--ink);min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .owe button{flex-shrink:0;font-size:12px;color:var(--ink);background:rgba(232,163,61,.18);
    border:1px solid var(--amber-glow);padding:5px 11px;border-radius:8px;cursor:pointer;transition:.2s}
  .owe button:hover{background:var(--amber);color:#1a1228}
  .owe-empty{font-size:13px;color:var(--ink-3);padding:14px;text-align:center;font-style:italic}

  /* Tab */
  .tabs{position:sticky;top:67px;z-index:20;display:flex;gap:6px;margin:18px 0 4px;
    padding:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(8px)}
  .tab{flex:1;padding:10px 8px;border:none;background:transparent;color:var(--ink-3);
    font-size:13px;font-family:var(--sans);cursor:pointer;border-radius:9px;transition:.2s;
    display:flex;flex-direction:column;align-items:center;gap:4px}
  .tab svg{width:18px;height:18px}
  .tab.active{background:linear-gradient(135deg,var(--amber),var(--wine));color:#1a1228;font-weight:600;
    box-shadow:0 4px 14px rgba(232,163,61,.25)}
  .tab.active svg{color:#1a1228}

  .panel{display:none;animation:fade .35s ease}
  .panel.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .section-title{font-family:var(--serif);font-size:16px;color:var(--amber-soft);margin:18px 2px 12px;
    display:flex;align-items:center;gap:8px}
  .section-title .line{flex:1;height:1px;background:linear-gradient(90deg,var(--amber-glow),transparent)}
  .ai-tip{display:flex;gap:10px;align-items:flex-start;padding:13px 15px;border-radius:12px;background:rgba(232,163,61,.08);border:1px solid rgba(232,163,61,.25);margin-bottom:14px}
  .ai-tip svg{width:20px;height:20px;flex-shrink:0;margin-top:3px;color:var(--amber-soft)}
  .ai-tip b{font-size:13px;color:var(--amber-soft)}
  .ai-tip p{font-size:12px;color:var(--ink-2);margin-top:2px;line-height:1.65}

  /* 心情选择 */
  .mood-smart{display:flex;gap:8px;margin-bottom:12px}
  .mood-smart input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
    color:var(--ink);font-size:14px;outline:none;transition:.2s;min-width:0}
  .mood-smart input::placeholder{color:var(--ink-3)}
  .mood-smart input:focus{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-glow)}
  .mood-smart .btn{white-space:nowrap;flex-shrink:0}
  .mood-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:8px}
  .mood{padding:16px 8px;border-radius:13px;background:var(--card);border:1px solid var(--line);
    cursor:pointer;transition:.2s;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
  .mood:hover{background:var(--card-2);border-color:var(--amber-glow);transform:translateY(-2px)}
  .mood svg{width:30px;height:30px}
  .mood span{font-size:13px;color:var(--ink-2)}
  .mood.picked{background:rgba(232,163,61,.14);border-color:var(--amber);box-shadow:0 0 16px var(--amber-glow)}
  .mood.picked span{color:var(--amber-soft)}

  /* 特调卡片 */
  .drink{border-radius:var(--radius);overflow:hidden;border:1px solid var(--amber-glow);
    background:linear-gradient(160deg,rgba(232,163,61,.10),rgba(139,44,63,.10));
    animation:fade .4s ease}
  .drink-top{display:flex;gap:16px;padding:18px;align-items:center}
  .glass{width:64px;height:80px;flex-shrink:0;position:relative}
  .drink-info{flex:1;min-width:0}
  .drink-info .cn{font-family:var(--serif);font-size:21px;color:var(--ink);font-weight:600}
  .drink-info .en{font-size:11px;color:var(--ink-3);letter-spacing:2px;text-transform:uppercase;margin-top:2px}
  .drink-info .base{font-size:12px;color:var(--amber-soft);margin-top:6px}
  .drink-body{padding:0 18px 18px}
  .drink-body .taste{font-size:13px;color:var(--ink-2);margin-bottom:12px}
  .drink-body .cure{margin-top:14px;margin-bottom:4px}
  .cure{padding:13px 15px;border-radius:11px;background:rgba(255,255,255,.04);
    border-left:3px solid var(--amber);font-size:14px;color:var(--ink);font-style:italic;line-height:1.7}
  .steps{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap}
  .step{font-size:11px;color:var(--ink-2);padding:5px 10px;background:var(--card);border:1px solid var(--line);border-radius:8px}
.points{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--amber-soft);padding:6px 11px;border:1px solid var(--amber-glow);border-radius:20px;background:rgba(232,163,61,.10);white-space:nowrap}
.points svg{width:14px;height:14px}
.order{border-radius:var(--radius);border:1px dashed var(--amber-glow);background:rgba(232,163,61,.06);padding:22px 20px;text-align:center}
.order .o-mood{font-size:13px;color:var(--ink-2);margin-bottom:6px}
.order .o-drink{font-family:var(--serif);font-size:19px;color:var(--ink);margin-bottom:12px}
.order .o-cost{font-size:12px;color:var(--amber-soft);margin-bottom:16px}
.order .o-hint{font-size:11px;color:var(--ink-3);margin-top:12px}
.mixing{text-align:center;padding:44px 20px}
.shaker{width:72px;height:72px;margin:0 auto 20px;animation:shake .7s ease-in-out infinite;transform-origin:center bottom}
@keyframes shake{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
.mixing-txt{font-family:var(--serif);font-size:17px;color:var(--amber-soft);margin-bottom:5px;text-shadow:0 0 10px var(--amber-glow)}
.mixing-sub{font-size:12px;color:var(--ink-3);letter-spacing:1px}
.how{margin-top:10px;padding:11px 13px;border-radius:10px;background:rgba(61,139,122,.10);border:1px solid rgba(61,139,122,.22);font-size:13px;color:var(--ink-2);line-height:1.7}
.how-label{display:inline-block;font-size:11px;color:#7fd0bc;font-weight:600;margin-right:8px;padding:2px 8px;background:rgba(61,139,122,.20);border-radius:6px;vertical-align:1px}
.steps-label{font-size:11px;color:var(--ink-3);margin-top:13px;margin-bottom:7px}
  /* 今日推荐 */
  .today-card{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,rgba(232,163,61,.14),rgba(123,60,180,.10));border:1px solid var(--amber-glow);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px;flex-wrap:wrap}
  .today-emoji{font-size:38px;flex-shrink:0}
  .today-info{flex:1;min-width:160px}
  .today-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .today-badge{font-size:11px;color:#1a1020;background:var(--amber);font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap;flex-shrink:0}
  .today-en{font-size:11px;color:var(--ink-3);margin-top:1px;flex:1;min-width:0;line-height:1.5}
  .today-cn{font-family:var(--serif);font-size:18px;color:var(--amber-soft);margin-top:7px}
  .today-en{font-size:11px;color:var(--ink-3);margin-top:1px}
  .today-why{font-size:12px;color:var(--ink-2);margin-top:7px;line-height:1.6}
  .today-btn{flex-shrink:0;background:var(--amber);color:#1a1020;font-weight:700;font-size:13px;padding:10px 18px;border-radius:22px;border:none;cursor:pointer;min-height:0}
  .today-btn:hover{background:#f2bd6a}
  /* 抽一杯 */
  .mood.lucky{background:linear-gradient(135deg,rgba(232,163,61,.18),rgba(123,60,180,.14));border:1px dashed var(--amber-glow)}
  .mood.lucky .lucky-emoji{font-size:30px;display:block;animation:diceSpin 2.4s ease-in-out infinite}
  @keyframes diceSpin{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(12deg) scale(1.08)}}
  .mood.lucky:hover{border-style:solid;border-color:var(--amber)}
  /* 心情趋势图 */
  .trend-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
  .trend-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .trend-title{font-family:var(--serif);font-size:15px;color:var(--amber-soft)}
  .trend-sub{font-size:11px;color:var(--ink-3)}
  .trend-svg{width:100%;height:130px;display:block}
  .trend-empty{text-align:center;padding:18px 10px;font-size:12px;color:var(--ink-3)}
  .trend-dot{fill:var(--amber);stroke:var(--bg-0);stroke-width:1.5}
  .trend-line{stroke:var(--amber);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round;opacity:.65}
  .trend-area{fill:url(#trendGrad);opacity:.2}
  .trend-txt{fill:var(--ink-3)}
  /* 酒柜 */
  .shelf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .shelf-card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px 18px;position:relative;display:flex;flex-direction:column;align-items:flex-start;min-height:118px}
  .shelf-card .cn{font-family:var(--serif);font-size:16px;color:var(--amber-soft);text-align:left}
  .shelf-card .en{font-size:10px;color:var(--ink-3);margin-top:3px;text-align:left}
  .shelf-card .base{font-size:11px;color:var(--ink-2);margin-top:9px;line-height:1.5;text-align:left}
  .shelf-card .shelf-cnt{display:inline-block;font-size:10px;color:#1a1020;background:rgba(232,163,61,.85);font-weight:700;padding:3px 10px;border-radius:20px;margin:10px 0 0;line-height:1.3;vertical-align:top;text-align:left;box-sizing:border-box;width:auto;max-width:100%}
  .shelf-card .rm{position:absolute;top:8px;right:9px;width:20px;height:20px;border:0;background:transparent;color:var(--ink-3);cursor:pointer;font-size:14px;line-height:1;border-radius:50%}
  .shelf-card .rm:hover{color:#e05c5c;background:rgba(224,92,92,.12)}
  .shelf-empty{text-align:center;padding:20px 10px;font-size:12px;color:var(--ink-3)}
  .shelf-tip{margin-top:14px;text-align:center;font-size:12px;color:var(--ink-3)}
  .shelf-tip a{color:var(--amber);text-decoration:none;font-weight:600}
  /* 勋章 */
  .badge-chip{display:inline-flex;align-items:center;gap:4px;margin-left:8px;font-size:11px;color:var(--amber-soft);background:rgba(232,163,61,.14);border:1px solid var(--amber-glow);border-radius:20px;padding:2px 9px;vertical-align:2px}
  .badge-chip .b-emoji{font-size:12px}
  /* 成就勋章墙 */
  .badge-cat{font-size:12px;color:var(--ink-3);margin:16px 2px 10px;display:flex;align-items:center;gap:8px}
  .badge-cat::before,.badge-cat::after{content:"";flex:1;height:1px;background:var(--line)}
  .badge-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .badge-card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:18px 12px 14px;text-align:center;opacity:.6;filter:grayscale(1);transition:.25s}
  .badge-card.got{opacity:1;filter:none;border-color:var(--amber-glow);background:linear-gradient(160deg,rgba(232,163,61,.16),rgba(255,255,255,.03))}
  .badge-card .b-ico{font-size:36px;line-height:1}
  .badge-card .b-name{font-family:var(--serif);font-size:15px;color:var(--amber-soft);margin-top:10px}
  .badge-card .b-need{font-size:11px;color:var(--ink-2);margin-top:5px}
  .badge-card .b-state{display:inline-block;font-size:10px;margin-top:9px;padding:3px 10px;border-radius:20px}
  .badge-card.got .b-state{background:rgba(232,163,61,.85);color:#1a1020;font-weight:700}
  .badge-card:not(.got) .b-state{background:var(--dim-bg);color:var(--ink-2)}
  .badge-bar{height:4px;border-radius:2px;background:var(--bar-bg);margin-top:10px;overflow:hidden}
  .badge-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#8a5a24,var(--amber))}
  /* 海报 */
  .act-row{display:flex;gap:10px;margin-top:14px}
  .act-row .btn{flex:1}
  /* 心情数据统计卡 */
  .stats-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
  .stat-card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 8px;text-align:center}
  .stat-card .v{font-family:var(--serif);font-size:20px;color:var(--amber-soft);font-weight:700}
  .stat-card .k{font-size:10px;color:var(--ink-3);margin-top:5px}
  /* 我的 */
  .me-list{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .me-item{display:flex;align-items:center;gap:12px;padding:15px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:.15s}
  .me-item:last-child{border-bottom:0}
  .me-item:hover{background:rgba(232,163,61,.06)}
  .me-item svg{width:18px;height:18px;color:var(--amber);flex-shrink:0}
  .me-txt{flex:1;font-size:14px;color:var(--ink)}
  .me-arrow{color:var(--ink-3);font-size:18px}
  .me-detail{margin-top:14px}
  .me-panel{background:var(--card);border:1px solid var(--amber-glow);border-radius:var(--radius);padding:18px}
  .me-panel h3{font-family:var(--serif);font-size:16px;color:var(--amber-soft);margin-bottom:12px}
  .me-panel p,.me-panel li{font-size:13px;color:var(--ink-2);line-height:1.8}
  .me-panel ul{padding-left:18px;margin:8px 0}
  .me-panel .close{margin-top:14px;width:100%}
  .me-panel .mood-tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;background:rgba(232,163,61,.14);color:var(--amber-soft);margin:2px 3px 2px 0}
  /* 主题选择 */
  .theme-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .theme-card{border:1px solid var(--line);border-radius:13px;padding:14px;cursor:pointer;background:var(--card);transition:.2s;text-align:center}
  .theme-card:hover{border-color:var(--amber-glow)}
  .theme-card.active{border-color:var(--amber);box-shadow:0 0 14px var(--amber-glow)}
  .theme-prev{display:flex;gap:6px;justify-content:center;margin-bottom:10px}
  .theme-prev i{width:26px;height:26px;border-radius:50%;border:1px solid var(--line)}
  .theme-name{font-size:13px;font-weight:600;color:var(--ink)}
  .theme-desc{font-size:10px;color:var(--ink-3);margin-top:4px;line-height:1.5}
  /* 积分明细 */
  .ledger-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--line);font-size:13px}
  .ledger-row:last-child{border-bottom:0}
  .ledger-l{color:var(--ink-2)}
  .ledger-d{font-size:11px;color:var(--ink-3);margin-top:2px}
  .ledger-v{font-weight:700}
  .ledger-v.plus{color:#5fb87a}
  .ledger-v.minus{color:#e05c5c}

  /* 表单 */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px}
  textarea,input[type=text],input[type=number]{width:100%;background:rgba(0,0,0,.25);
    border:1px solid var(--line);border-radius:11px;padding:12px 14px;color:var(--ink);
    font-size:16px;font-family:var(--sans);resize:vertical;transition:.2s}
  textarea{min-height:90px;line-height:1.7}
  textarea:focus,input:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-glow)}
  textarea::placeholder,input::placeholder{color:var(--ink-3)}
  label.fl{font-size:12px;color:var(--ink-2);display:block;margin-bottom:7px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row>*{flex:1;min-width:120px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:12px 20px;border-radius:11px;border:none;cursor:pointer;font-size:14px;font-family:var(--sans);
    font-weight:600;transition:.2s;min-height:44px}
  .btn-pri{background:linear-gradient(135deg,var(--amber),var(--wine));color:#1a1228;
    box-shadow:0 4px 16px rgba(232,163,61,.25)}
  .btn-pri:hover{filter:brightness(1.1);transform:translateY(-1px)}
  .btn-ghost{background:var(--card-2);color:var(--ink-2);border:1px solid var(--line)}
  .btn-ghost:hover{color:var(--amber-soft);border-color:var(--amber-glow)}
  .btn svg{width:16px;height:16px}
  .form-foot{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .form-foot .btn{flex:1;min-width:130px}

  /* 滑块 */
  .slider-wrap{display:flex;align-items:center;gap:14px}
  input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;
    background:linear-gradient(90deg,var(--wine),var(--amber),var(--green));outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;
    background:var(--amber-soft);border:3px solid #1a1228;box-shadow:0 0 10px var(--amber-glow);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--amber-soft);
    border:3px solid #1a1228;cursor:pointer}
  .score-val{font-family:var(--serif);font-size:26px;color:var(--amber-soft);min-width:48px;text-align:center;
    font-weight:600}

  /* 时间轴 / 留言墙 */
  .feed{display:flex;flex-direction:column;gap:12px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px;
    position:relative;transition:.2s}
  .item:hover{border-color:var(--card-2)}
  .item.unresolved{border-color:rgba(232,88,74,.3);background:rgba(232,88,74,.06)}
  .item-head{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
  .chip{font-size:11px;padding:3px 9px;border-radius:8px;font-weight:600}
  .chip-msg{background:rgba(139,44,63,.22);color:#e89aa6}
  .chip-diary{background:rgba(61,139,122,.20);color:#7fd0bc}
  .chip-mood{background:var(--card-2);color:var(--ink-2)}
  .chip-owe{background:rgba(232,88,74,.2);color:var(--red)}
  .chip-ok{background:rgba(95,184,122,.18);color:var(--green)}
  .item-date{font-size:11px;color:var(--ink-3);margin-left:auto}
  .item-txt{font-size:14px;color:var(--ink);line-height:1.7}
  .item-cure{margin-top:9px;padding:10px 12px;border-radius:9px;background:rgba(232,163,61,.07);
    border-left:2px solid var(--amber);font-size:13px;color:var(--ink-2);font-style:italic}
  .item-foot{display:flex;align-items:center;gap:10px;margin-top:11px}
  .score-pill{font-size:12px;color:var(--amber-soft);font-weight:600}
  .more-btn{width:100%;margin-top:14px;padding:12px;border-radius:11px;border:1px dashed var(--amber-glow);background:rgba(232,163,61,.07);color:var(--amber-soft);font-size:13px;cursor:pointer;transition:.2s}
  .more-btn:hover{background:rgba(232,163,61,.15)}
  .mini-btn{font-size:12px;padding:6px 12px;border-radius:8px;cursor:pointer;border:1px solid var(--line);
    background:var(--card-2);color:var(--ink-2);transition:.2s;margin-left:auto}
  .mini-btn:hover{color:var(--amber-soft);border-color:var(--amber-glow)}
  .mini-btn.danger:hover{color:var(--red);border-color:rgba(232,88,74,.4)}
  .empty{text-align:center;padding:36px 16px;color:var(--ink-3)}
  .empty svg{width:42px;height:42px;margin-bottom:10px;opacity:.5}

  /* 提示条 */
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);
    background:rgba(20,16,31,.96);border:1px solid var(--amber-glow);color:var(--ink);
    padding:11px 18px;border-radius:11px;font-size:13px;z-index:60;opacity:0;transition:.3s;
    box-shadow:0 8px 30px rgba(0,0,0,.5);pointer-events:none;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* 底部Tab（移动端） */
  .bottom-tabs{display:none}

  /* 弹窗 */
  .mask{position:fixed;inset:0;background:rgba(5,4,10,.7);backdrop-filter:blur(4px);z-index:80;
    display:none;align-items:center;justify-content:center;padding:20px}
  .mask.show{display:flex}
  .modal{background:var(--bg-1);border:1px solid var(--line);border-radius:var(--radius);
    max-width:380px;width:100%;padding:22px}
  .modal h3{font-family:var(--serif);font-size:17px;color:var(--amber-soft);margin-bottom:10px}
  .modal p{font-size:13px;color:var(--ink-2);margin-bottom:16px;line-height:1.7}
  .modal .act{display:flex;gap:10px}
  .modal .act .btn{flex:1}
  /* 海报浮层 */
  .poster-modal{background:var(--bg-1);border:1px solid var(--amber-glow);border-radius:var(--radius);
    max-width:380px;width:100%;padding:18px;text-align:center}
  .poster-img{width:100%;border-radius:10px;display:block;max-height:68vh;object-fit:contain}
  .poster-tip{font-size:12px;color:var(--amber-soft);margin:12px 0;line-height:1.6}
  .poster-modal .close{width:100%;margin-top:2px}

  @media(max-width:600px){
    .mood-grid{grid-template-columns:repeat(2,1fr)}
    .drink-top{flex-direction:column;text-align:center;gap:12px}
    .logo-txt span{display:none}
    .tabs{display:none}
    .bottom-tabs{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:40;
      background:linear-gradient(0deg,rgba(11,10,20,.98),rgba(11,10,20,.85));
      border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));
      backdrop-filter:blur(12px)}
    .bottom-tabs .tab{flex:1}
    .wrap{padding-bottom:90px}
    .open-head{flex-wrap:wrap}
  }
</style>
</head>
<body>
<header class="bar">
  <div class="bar-inner">
    <div class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M5 3h14l-2 9a5 5 0 0 1-10 0L5 3z" stroke="#1a1228" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 17v4M9 21h6" stroke="#1a1228" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="9" r="1.4" fill="#1a1228"/></svg>
      </div>
      <div class="logo-txt">
        <h1>夜半微醺</h1>
        <span>E-Bar · 解忧酒馆</span>
      </div>
    </div>
    <div class="points" id="points"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/><path d="M12 7v10M9.5 9.5c0-1 1.1-1.8 2.5-1.8s2.5.8 2.5 1.8-1.1 1.8-2.5 1.8-2.5.8-2.5 1.8 1.1 1.8 2.5 1.8 2.5-.8 2.5-1.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><span class="num">100</span></div>
    <div class="sync" id="syncBox"><span class="dot"></span><span id="syncTxt">已同步</span></div>
    <button class="icon-btn" id="exportBtn" title="导出备份">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 17v2a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</header>

<div class="wrap">
  <!-- 今夜开门营业 -->
  <section class="open-sign">
    <div class="open-head">
      <span class="neon">今夜开门营业</span>
      <span class="sub">连续光顾 <span class="streak" id="streak">1</span> 晚<span class="badge-chip" id="badgeChip" style="display:none"><span class="b-emoji" id="badgeEmoji">🍺</span><span id="badgeName"></span></span></span>
    </div>
    <div class="open-body">
      <p class="tip">这几桩心事还压在心里，今晚要不要试着放下？</p>
      <div class="owe-list" id="oweList"></div>
    </div>
  </section>

  <!-- Tab -->
  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="mix"><svg viewBox="0 0 24 24" fill="none"><path d="M5 3h14l-2 9a5 5 0 0 1-10 0L5 3z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 17v4M9 21h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>今夜特调</button>
    <button class="tab" data-tab="talk"><svg viewBox="0 0 24 24" fill="none"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.5A8 8 0 1 1 21 12z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>解忧酒馆</button>
    <button class="tab" data-tab="shelf"><svg viewBox="0 0 24 24" fill="none"><path d="M5 6h14l1.5 11a2 2 0 0 1-2 2.2h-13A2 2 0 0 1 3.5 17L5 6z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M8.5 10V6a3.5 3.5 0 0 1 7 0v4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>我的酒柜</button>
    <button class="tab" data-tab="stats"><svg viewBox="0 0 24 24" fill="none"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>心情</button>
    <button class="tab" data-tab="me"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.7"/><path d="M5 21a7 7 0 0 1 14 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>我的</button>
  </nav>

  <!-- 模块1 今夜特调 -->
  <section class="panel active" id="p-mix">
    <div class="section-title">今日推荐<span class="line"></span></div>
    <div class="today-card" id="todayCard"></div>
    <div class="section-title">今晚，你是什么心情？<span class="line"></span></div>
    <div class="mood-smart">
      <input type="text" id="moodInput" maxlength="60" placeholder="直接说出来，比如：今天加班好累 / 和对象吵架了 / 拿到 offer 了！">
      <button class="btn btn-pri" id="moodGo">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 3l2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5L12 3z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        为我选一杯
      </button>
    </div>
    <div class="mood-grid" id="moodGrid"></div>
    <div id="drinkSlot"></div>
    <div class="section-title">今晚这一杯<span class="line"></span></div>
    <div class="card">
      <label class="fl">心情分数（1 低谷 · 10 愉悦）</label>
      <div class="slider-wrap">
        <input type="range" id="score" min="1" max="10" value="6">
        <div class="score-val" id="scoreVal">6</div>
      </div>
      <div style="height:14px"></div>
      <label class="fl">今夜特调（酒名）</label>
      <input type="text" id="drinkName" placeholder="莫吉托 / 热托迪 / 一杯白开水也好…">
      <div style="height:12px"></div>
      <label class="fl">想说的话</label>
      <textarea id="diaryInput" placeholder="微醺的时候，写点什么吧。"></textarea>
      <div class="form-foot">
        <button class="btn btn-pri" id="diarySend">
          <svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          记下今晚
        </button>
        <button class="btn btn-ghost" id="diaryClear">清空</button>
      </div>
    </div>
    <div class="section-title">微醺时间轴<span class="line"></span></div>
    <div class="feed" id="diaryFeed"></div>
  </section>

  <!-- 模块2 解忧酒馆 -->
  <section class="panel" id="p-talk">
    <div class="section-title">把烦恼说给酒保听<span class="line"></span></div>
    <div class="ai-tip">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M8.5 11.5h.01M15.5 11.5h.01" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M8.5 14.5 Q12 18 15.5 14.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <div><b>您的 AI 酒保在线</b></div>
    </div>
    <div class="card">
      <label class="fl">今夜的心事</label>
      <textarea id="talkInput" placeholder="工作、感情、未来……什么都行，这里只有你和我。"></textarea>
      <div class="form-foot">
        <button class="btn btn-pri" id="talkSend">
          <svg viewBox="0 0 24 24" fill="none"><path d="M3 12l18-8-8 18-2-7-8-3z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
          投递烦恼
        </button>
        <button class="btn btn-ghost" id="talkClear">清空</button>
      </div>
    </div>
    <div class="section-title">心事墙<span class="line"></span></div>
    <div class="feed" id="talkFeed"></div>
  </section>

  <!-- 模块3 我的酒柜 -->
  <section class="panel" id="p-shelf">
    <div class="section-title">我的酒柜<span class="line"></span></div>
    <div class="shelf-grid" id="shelfGrid"></div>
    <div class="shelf-tip">收藏想再喝的酒，攒成你的专属酒单。去 <a href="javascript:void(0)" onclick="goTab('mix')">今夜特调</a> 挑一杯收进来吧。</div>
  </section>

  <!-- 模块4 心情数据 -->
  <section class="panel" id="p-stats">
    <div class="section-title">心情数据<span class="line"></span></div>
    <div class="stats-cards" id="statsCards"></div>
    <div class="trend-card"><div id="trendBox"></div></div>
  </section>

  <!-- 模块5 我的 -->
  <section class="panel" id="p-me">
    <div class="section-title">我的<span class="line"></span></div>
    <div class="me-list">
      <div class="me-item" onclick="goTab('stats')"><svg viewBox="0 0 24 24" fill="none"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="me-txt">心情数据</span><span class="me-arrow">›</span></div>
      <div class="me-item" onclick="openMe('tasks')"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3l1.8 5.4H19l-4.6 3.4 1.8 5.4-4.2-3.2-4.2 3.2 1.8-5.4L5 8.4h5.2L12 3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><span class="me-txt">积分任务</span><span class="me-arrow">›</span></div>
      <div class="me-item" onclick="openMe('badges')"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="9" r="5" stroke="currentColor" stroke-width="1.6"/><path d="M8.5 13.5L7 21l5-2.5L17 21l-1.5-7.5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><span class="me-txt">成就勋章</span><span class="me-arrow">›</span></div>
      <div class="me-item" onclick="openMe('ledger')"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3v18M5 8l7-5 7 5M5 16l7 5 7-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="me-txt">积分明细</span><span class="me-arrow">›</span></div>
      <div class="me-item" onclick="openMe('about')"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M12 11v5M12 8h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span class="me-txt">关于</span><span class="me-arrow">›</span></div>
      <div class="me-item" onclick="openMe('theme')"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.6"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span class="me-txt">主题</span><span class="me-arrow">›</span></div>
      <div class="me-item" onclick="openMe('guide')"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3l9 4-9 4-9-4 9-4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M3 11l9 4 9-4M3 15l9 4 9-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="me-txt">使用须知</span><span class="me-arrow">›</span></div>
    </div>
    <div class="me-detail" id="meDetail"></div>
  </section>
</div>

<!-- 底部Tab（移动端） -->
<nav class="bottom-tabs" id="btabs">
  <button class="tab active" data-tab="mix"><svg viewBox="0 0 24 24" fill="none"><path d="M5 3h14l-2 9a5 5 0 0 1-10 0L5 3z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 17v4M9 21h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>特调</button>
  <button class="tab" data-tab="talk"><svg viewBox="0 0 24 24" fill="none"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.5A8 8 0 1 1 21 12z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>解忧</button>
  <button class="tab" data-tab="shelf"><svg viewBox="0 0 24 24" fill="none"><path d="M5 6h14l1.5 11a2 2 0 0 1-2 2.2h-13A2 2 0 0 1 3.5 17L5 6z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M8.5 10V6a3.5 3.5 0 0 1 7 0v4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>酒柜</button>
  <button class="tab" data-tab="stats"><svg viewBox="0 0 24 24" fill="none"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>心情</button>
  <button class="tab" data-tab="me"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.7"/><path d="M5 21a7 7 0 0 1 14 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>我的</button>
</nav>

<div class="toast" id="toast"></div>

<!-- 确认弹窗 -->
<div class="mask" id="mask">

/* 数组按 id 合并去重 */
function mergeArr(a,b){
  var m={},out=[];
  (a||[]).concat(b||[]).forEach(function(r){if(r&&r.id&&!m[r.id]){m[r.id]=1;out.push(r)}});
  if(out.length>200)out=out.slice(0,200);
  return out;
}
function mergeObj(a,b){
  var o={};for(var k in (a||{}))o[k]=a[k];for(var k in (b||{}))o[k]=b[k];return o;
}
/* 合并本地与云端：数组记录合并去重，标量取最近写入方，整体 ts 取大 */
function mergeState(local,cloud){
  if(!cloud)return local;
  var lt=local.ts||0,ct=cloud.ts||0;
  var base=lt>=ct?local:cloud;
  return {
    cache:mergeArr(local.cache,cloud.cache),
    ledger:mergeArr(local.ledger,cloud.ledger),
    shelf:mergeArr(local.shelf,cloud.shelf),
    cnt:mergeObj(local.cnt,cloud.cnt),
    points:base.points,streak:base.streak,daily:base.daily,seeded:base.seeded,theme:base.theme,
    ts:Math.max(lt,ct)
  };
}

/* Worker 请求封装 */
async function cloudFetch(path,method,body){
  var opt={method:method||"GET",headers:{}};
  if(CLOUD_TOKEN)opt.headers["x-sync-token"]=CLOUD_TOKEN;
  if(body){opt.headers["Content-Type"]="application/json";opt.body=JSON.stringify(body)}
  var resp=await fetch(CLOUD_URL+path,opt);
  if(!resp.ok)throw new Error("cloud "+resp.status);
  return resp.json();
}
/* 一次完整同步：拉云端 → 合并 → 写本地 → 推云端（幂等，多端安全） */
async function cloudSync(){
  if(!CLOUD_URL)return;
  try{
    var cloud=await cloudFetch("/state");
    var local=snapshotAll();
    var merged=mergeState(local,cloud);
    merged.ts=Date.now();
    applyState(merged);
    await cloudFetch("/state","PUT",merged);
    markDirty();
  }catch(e){console.warn("cloud sync fail",e)}
}
/* 写操作后防抖触发同步 */
var _cloudTimer=null;
function saveCloud(){
  if(!CLOUD_URL)return;
  markDirty();
  clearTimeout(_cloudTimer);
  _cloudTimer=setTimeout(function(){cloudSync()},1500);
}

function setSync(state){var b=el("syncBox"),t=el("syncTxt");if(state==="on"){b.classList.remove("off");t.textContent="已同步"}else if(state==="sync"){b.classList.add("off");t.textContent="同步中"}else{b.classList.remove("off");b.classList.add("off");t.textContent="离线模式"}}

/* 超时包装：超时则 reject，让调用方走 catch 降级 */
function withTimeout(p,ms){return Promise.race([p,new Promise(function(_,rej){setTimeout(function(){rej(new Error("timeout"))},ms)})])}
/* 云端不可用：永久切本地，后续不再尝试云端，保证 UI 始终可点 */
function goOffline(){db=null;online=false;setSync("off")}

/* 加载所有记录：先尝试云端，失败/超时用本地缓存 */
var ALL=[];
async function loadAll(){
  setSync("sync");
  if(db){
    try{
      var all=[];var cursor=null;
      do{
        var r=await withTimeout(db.query({databaseId:DB_ID,sorts:[{property:"日期",direction:"descending"}],pageSize:100,startCursor:cursor}),DB_TIMEOUT);
        var rs=r.results||[];for(var i=0;i<rs.length;i++){all.push(normalize(rs[i]))}
        cursor=r.nextCursor;var more=r.hasMore;
      }while(more && cursor);
      ALL=all;cacheSet(all);setSync("on");return;
    }catch(e){console.warn("cloud load fail",e);goOffline()}
  }
  ALL=cacheGet();setSync("off");
  if(ALL.length===0 && !seeded()){ALL=SAMPLE_DATA.slice();cacheSet(ALL);markSeeded()}
}
function normalize(row){
  return {
    id:row._id||row.id||"",
    type:row["类型"]||"",
    mood:row["心情"]||"",
    content:row["心事内容"]||"",
    cure:row["治愈回信"]||"",
    score:row["心情分数"]||0,
    drink:row["今夜特调"]||"",
    status:row["状态"]||"",
    date:row["日期"]||""
  };
}
async function addRec(props){
  if(db){try{var r=await withTimeout(db.addRecord({databaseId:DB_ID,properties:props}),DB_TIMEOUT);var nid=r.id||r._id||(r.result&&r.result.id)||"";var rec=normalize2(props);rec.id=nid||("local_"+Date.now());ALL.unshift(rec);cacheSet(ALL);saveCloud();return rec}catch(e){console.warn(e);goOffline()}}
  var rec=normalize2(props);rec.id="local_"+Date.now();ALL.unshift(rec);cacheSet(ALL);saveCloud();return rec;
}
function normalize2(props){
  return {
    id:"",type:(props["类型"]&&props["类型"].select)||"",mood:(props["心情"]&&props["心情"].select)||"",
    content:(props["心事内容"]&&props["心事内容"].text)||"",cure:(props["治愈回信"]&&props["治愈回信"].text)||"",
    score:(props["心情分数"]&&props["心情分数"].number)||0,drink:(props["今夜特调"]&&props["今夜特调"].text)||"",
    status:(props["状态"]&&props["状态"].select)||"",date:(props["日期"]&&props["日期"].date)||""
  };
}
async function updRec(id,props){
  if(db){try{await withTimeout(db.updateRecord({databaseId:DB_ID,recordId:id,properties:props}),DB_TIMEOUT)}catch(e){console.warn(e);goOffline()}}
  for(var j=0;j<ALL.length;j++){if(ALL[j].id===id){var n=normalize2(props);for(var kk in n){ALL[j][kk]=n[kk]}}}

function renderTrend(){
  var box=el("trendBox");
  if(!box)return;
  var list=ALL.filter(function(r){return r.type==="微醺日记"&&r.score});
  list.sort(function(a,b){return a.date<b.date?-1:1});
  list=list.slice(-14);
  if(list.length<2){box.innerHTML='<div class="trend-empty">喝完两杯再来画曲线——心情分数记够 2 条，就能看到你的情绪走向。</div>';return}
  var W=600,H=130,padL=34,padR=14,padT=16,padB=22;
  var min=1,max=10;
  var xs=[];var pts=[];
  for(var i=0;i<list.length;i++){
    var x=padL+(W-padL-padR)*i/(list.length-1);
    var sc=Math.max(1,Math.min(10,list[i].score));
    var y=padT+(H-padT-padB)*(1-(sc-min)/(max-min));
    xs.push(x);pts.push({x:x,y:y,r:list[i],sc:sc});
  }
  var line=pts.map(function(p,i){return (i===0?"M":"L")+p.x.toFixed(1)+" "+p.y.toFixed(1)}).join(" ");
  var area=line+" L"+xs[xs.length-1].toFixed(1)+" "+(H-padB).toFixed(1)+" L"+xs[0].toFixed(1)+" "+(H-padB).toFixed(1)+" Z";
  var dots=pts.map(function(p){
    return '<circle class="trend-dot" cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="3.4"><title>'+fmtDate(p.r.date)+' · 心情 '+p.sc+'/10</title></circle>';
  }).join("");
  var labels=pts.map(function(p){
    return '<text class="trend-txt" x="'+p.x.toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" font-size="9">'+String(p.r.date).slice(5).replace("-","/")+'</text>';
  }).join("");
  var marks=[1,5,10].map(function(v){
    var y=padT+(H-padT-padB)*(1-(v-min)/(max-min));
    return '<text class="trend-txt" x="6" y="'+(y+3)+'" font-size="9">'+v+'</text>';
  }).join("");
  box.innerHTML='<div class="trend-head"><div><span class="trend-title">最近的心情曲线</span><div class="trend-sub">近 '+list.length+' 次微醺记录 · 分数越高越愉悦</div></div></div><svg class="trend-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none"><defs><linearGradient id="trendGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--amber)"/><stop offset="1" stop-color="var(--amber)" stop-opacity="0"/></linearGradient></defs><path class="trend-area" d="'+area+'"></path><path class="trend-line" d="'+line+'"></path>'+dots+marks+labels+'</svg>';
}

/* 分享海报：canvas 绘制今晚的酒 */
function makePoster(m){
  var d=m.drink;
  var c=document.createElement("canvas");
  c.width=750;c.height=1200;
  var g=c.getContext("2d");
  var bg=g.createLinearGradient(0,0,0,1200);
  bg.addColorStop(0,"#1c1510");bg.addColorStop(0.55,"#241b12");bg.addColorStop(1,"#15100c");
  g.fillStyle=bg;g.fillRect(0,0,750,1200);
  /* 氛围光斑 */
  g.save();g.globalAlpha=0.16;
  var rg=g.createRadialGradient(560,180,20,560,180,360);
  rg.addColorStop(0,"#e8a33d");rg.addColorStop(1,"rgba(232,163,61,0)");
  g.fillStyle=rg;g.beginPath();g.arc(560,180,360,0,Math.PI*2);g.fill();
  var rg2=g.createRadialGradient(120,980,20,120,980,320);
  rg2.addColorStop(0,"#8a4f2c");rg2.addColorStop(1,"rgba(138,79,44,0)");
  g.fillStyle=rg2;g.beginPath();g.arc(120,980,320,0,Math.PI*2);g.fill();
  g.restore();
  /* 边框 */
  g.strokeStyle="rgba(232,163,61,.55)";g.lineWidth=2;g.strokeRect(30,30,690,1140);
  g.strokeStyle="rgba(232,163,61,.25)";g.lineWidth=1;g.strokeRect(42,42,666,1116);
  /* 顶部 */
  g.fillStyle="#e8a33d";g.font="600 30px 'Songti SC','Noto Serif SC',serif";
  g.textAlign="center";
  g.fillText("夜 半 微 醺",375,130);
  g.fillStyle="#8f806c";g.font="22px sans-serif";
  g.fillText("— 今夜特调 —",375,176);
  /* 酒杯 emoji 放中间 */
  g.font="150px serif";g.fillText("🍸",375,420);
  /* 酒名 */
  g.fillStyle="#f2d9ae";g.font="700 64px 'Songti SC','Noto Serif SC',serif";
  g.fillText(d.cn,375,560);
  g.fillStyle="#9b8b74";g.font="28px sans-serif";
  g.fillText(d.en||"",375,616);
  /* 基酒 */
  g.fillStyle="#b8a48c";g.font="30px sans-serif";
  g.fillText(d.base||"",375,700);
  /* 治愈语 */
  g.fillStyle="#d9c6a8";g.font="34px 'Songti SC','Noto Serif SC',serif";
  var words=wrapCure(d.cure||"");
  var wy=820;
  for(var i=0;i<words.length;i++){g.fillText(words[i],375,wy);wy+=54}
  /* 日期 */
  g.fillStyle="#6b5f4f";g.font="26px sans-serif";
  g.fillText(todayStr()+" · 夜半微醺电子酒吧",375,wy+40);
  var url=c.toDataURL("image/png");
  /* 移动端（iOS/微信等长按保存最稳）：弹浮层，桌面端直接下载 */
  if(/Mobi|Android|iPhone|iPad|WeChat/i.test(navigator.userAgent)){
    openPoster(url);
  }else{
    var a=document.createElement("a");
    a.href=url;a.download="夜半微醺_"+d.cn+"_"+todayStr()+".png";a.click();
    toast("海报已生成，看看下载文件夹");
  }
}

function wrapCure(s){
  var arr=[];var cur="";
  for(var i=0;i<s.length;i++){
    cur+=s[i];
    if(cur.length>=9&&(s[i]==="，"||s[i]==="。"||s[i]==="、")){arr.push(cur);cur=""}
    else if(cur.length>=11){arr.push(cur);cur=""}
  }
  if(cur)arr.push(cur);
  return arr;
}

function smartMood(text){
  var t=String(text||"").toLowerCase();
  var best=null,bs=0;
  for(var i=0;i<MOODS.length;i++){
    var kws=MOOD_KW[MOODS[i].key]||[];var s=0;
    for(var j=0;j<kws.length;j++){if(t.indexOf(kws[j])>=0)s++}
    if(s>bs){bs=s;best=MOODS[i]}
  }
  return bs>0?best:null;
}

/* AI 酒保：调 Cloudflare Worker 代理走混元，失败/未配走关键词兜底 */
async function askBartender(text){
  if(!BARTENDER_PROXY){return matchCure(text)}
  try{
    var ctrl=new AbortController();var tid=setTimeout(function(){ctrl.abort()},8000);
    var resp=await fetch(BARTENDER_PROXY,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:text}),signal:ctrl.signal});
    clearTimeout(tid);
    if(!resp.ok)throw new Error("http "+resp.status);
    var j=await resp.json();
    if(j&&j.reply)return j.reply;
    throw new Error("empty");
  }catch(e){
    return matchCure(text);
  }
}

async function sendTalk(){
  var v=el("talkInput").value.trim();
  if(!v){toast("先写点什么吧");return}
  el("talkSend").disabled=true;
  var orig=el("talkSend").innerHTML;
  el("talkSend").innerHTML="酒保思考中…";
  var cure=await askBartender(v);
  await addRec({"类型":{"select":"解忧留言"},"心事内容":{"text":v},"治愈回信":{"text":cure},"状态":{"select":"未释怀"},"日期":{"date":todayStr()}});
  el("talkInput").value="";el("talkSend").disabled=false;el("talkSend").innerHTML=orig;
  renderAll();pointsAdd(5,"投递烦恼");toast("投递烦恼 +5 积分，酒保回信已送达");
}
async function sendDiary(){
  var v=el("diaryInput").value.trim();
  var drink=el("drinkName").value.trim();
  var score=+el("score").value;
  if(!v&&!drink){toast("写点什么，或填个酒名吧");return}
  el("diarySend").disabled=true;
  await addRec({"类型":{"select":"微醺日记"},"心事内容":{"text":v},"心情分数":{"number":score},"今夜特调":{"text":drink},"状态":{"select":"已释怀"},"日期":{"date":todayStr()}});
  el("diaryInput").value="";el("drinkName").value="";el("score").value=6;el("scoreVal").textContent="6";
  el("diarySend").disabled=false;
  renderAll();pointsAdd(5,"写微醺日记");toast("记下今晚 +5 积分");
}

/* 导出备份 */
function exportJSON(){
  var data=JSON.stringify(ALL,null,2);
  var blob=new Blob([data],{type:"application/json"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");a.href=url;a.download="夜半微醺_备份_"+todayStr()+".json";a.click();

/* 弹窗 */
var modalCb=null;
function openModal(title,desc,cb){el("mTitle").textContent=title;el("mDesc").textContent=desc;modalCb=cb;el("mask").classList.add("show")}
function closeModal(){el("mask").classList.remove("show");modalCb=null}

/* Tab */
function bindTabs(){
  var all=document.querySelectorAll("[data-tab]");
  all.forEach(function(n){n.addEventListener("click",function(){
    var t=n.dataset.tab;
    document.querySelectorAll("[data-tab]").forEach(function(x){x.classList.toggle("active",x.dataset.tab===t)});
    document.querySelectorAll(".panel").forEach(function(p){p.classList.remove("active")});
    el("p-"+t).classList.add("active");
    window.scrollTo({top:0,behavior:"smooth"});
  })});
}
window.goTab=function(t){
  var node=document.querySelector('[data-tab="'+t+'"]');
  if(node)node.click();
};

/* ============ 初始化 ============ */
async function init(){
  el("streak").textContent=streakMark();
  renderPoints();
  renderBadge();
  dailyBonus();
  renderToday();
  buildMoods();
  el("moodGo").addEventListener("click",smartOrder);
  el("moodInput").addEventListener("keydown",function(e){if(e.key==="Enter")smartOrder()});
  bindTabs();
  el("score").addEventListener("input",function(){el("scoreVal").textContent=this.value});
  el("talkSend").addEventListener("click",sendTalk);
  el("diarySend").addEventListener("click",sendDiary);
  el("talkClear").addEventListener("click",function(){el("talkInput").value=""});
  el("diaryClear").addEventListener("click",function(){el("diaryInput").value="";el("drinkName").value=""});
  el("exportBtn").addEventListener("click",exportJSON);
  el("mCancel").addEventListener("click",closeModal);
  el("mask").addEventListener("click",function(e){if(e.target===el("mask"))closeModal()});
  el("mOk").addEventListener("click",function(){if(typeof modalCb==="function")modalCb();closeModal()});

  /* 云存档同步：拉云端合并 → 渲染；超时/失败静默降级到本地数据 */
  if(CLOUD_URL){try{await withTimeout(cloudSync(),CLOUD_TIMEOUT)}catch(e){console.warn("cloud init sync skipped",e)}}
  renderAll();
  /* 数据量大时温和提示 */
  if(ALL.length>=30){toast("数据已积累 "+ALL.length+" 条，建议导出备份")}
}
init();
